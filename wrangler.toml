# 数学学霸模拟器 — Cloudflare Pages 配置
#
# 推荐部署方式：Cloudflare 控制台「连接 Git」一键部署（详见下方说明）
#   · 框架预设：无（None）
#   · 构建输出目录：.   （仓库根，即前端静态文件所在）
#   · 函数目录：functions/（本文件已包含 /api/* 的 Pages Functions）
#   · 必须绑定一个 KV 命名空间，绑定名必须为 DB（排行榜持久化存储）
#
# 若改用 wrangler CLI 部署，把下方 id 换成你的 KV 命名空间 ID，然后：
#   npx wrangler pages deploy . --branch main

name = "math-genius-app"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

# KV 绑定：排行榜持久化。
# ⚠️ 控制台 Git 连接部署：不要在这里写 [[kv_namespaces]]！
#   改去：Pages 项目 → 设置 → 函数 → KV 命名空间绑定 → 变量名填 DB → 选命名空间。
# CLI 部署才需要取消下方注释并填入真实 id。
# [[kv_namespaces]]
# binding = "DB"
# id = "你的真实KV命名空间ID"

# （可选）真实微信 OAuth 凭据。不填则走开发模拟登录。
# [vars]
# WX_APPID = ""
# WX_SECRET = ""
